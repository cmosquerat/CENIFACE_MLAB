version: '3.8'

services:
  # Proxy Bridge: Maneja la autenticación con Bright Data
  # Los demás contenedores solo apuntan aquí sin credenciales
  proxy-bridge:
    image: ginuerzh/gost:latest
    container_name: proxy-bridge
    command: -L=:8080 -F=http://brd-customer-hl_6ad5dde5-zone-datacenter_proxy1-country-CO:vekb114yzhdx@brd.superproxy.io:33335
    ports:
      - "8080:8080"
    restart: unless-stopped
    networks:
      - multilab-network
    healthcheck:
      test: ["CMD", "wget", "--spider", "-q", "http://localhost:8080"]
      interval: 30s
      timeout: 10s
      retries: 3

  # Aplicación Multilab
  multilab-web:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: multilab-agroanalitica
    depends_on:
      proxy-bridge:
        condition: service_healthy
    ports:
      - "5005:5000"
    environment:
      - PORT=5000
      - HOST=0.0.0.0
      - DEBUG=False
      - DB_PATH=/app/data/multilab.db
      - PDF_STORAGE_DIR=/app/static/pdfs
      # Proxy transparente: solo apuntamos al bridge interno (sin credenciales)
      - HTTP_PROXY=http://proxy-bridge:8080
      - HTTPS_PROXY=http://proxy-bridge:8080
      - http_proxy=http://proxy-bridge:8080
      - https_proxy=http://proxy-bridge:8080
      - NO_PROXY=localhost,127.0.0.1,::1,*.local
      - no_proxy=localhost,127.0.0.1,::1,*.local
    env_file:
      - .env
    volumes:
      - ./multilab.db:/app/multilab.db:ro
      - ./static/pdfs:/app/static/pdfs
    restart: unless-stopped
    networks:
      - multilab-network
    deploy:
      resources:
        limits:
          memory: 2G
        reservations:
          memory: 512M
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:5000/health", "||", "exit", "1"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 40s

networks:
  multilab-network:
    driver: bridge
