version: '3.8'

services:
  multilab-web:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: multilab-agroanalitica
    ports:
      - "5015:5000"
    environment:
      - PORT=5000
      - HOST=0.0.0.0
      - DEBUG=False
      - DB_PATH=/app/data/multilab.db
      - PDF_STORAGE_DIR=/app/static/pdfs
    # Cargar variables de entorno desde .env si existe (se ignora silenciosamente si no existe)
    env_file:
      - .env
    volumes:
      # Montar base de datos como volumen para persistencia (ruta debe coincidir con DB_PATH)
      # IMPORTANTE: El archivo multilab.db debe existir en el directorio raíz del proyecto
      - ./multilab.db:/app/data/multilab.db:ro
      # Montar directorio de PDFs para acceso desde host
      - ./static/pdfs:/app/static/pdfs
      # Montar .env dentro del contenedor (opcional: comenta esta línea si .env no existe)
      # - ./.env:/app/.env:ro
    restart: unless-stopped
    # Límites de recursos (aumentados para Chrome/Selenium)
    deploy:
      resources:
        limits:
          memory: 4G  # Aumentado de 2G a 4G para Chrome headless
          cpus: '2.0'  # Agregado límite de CPU
        reservations:
          memory: 1G  # Aumentado de 512M a 1G
          cpus: '0.5'  # Agregado reserva mínima de CPU
    # Health check
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:5000/health", "||", "exit", "1"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 40s

