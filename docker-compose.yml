version: '3.8'

services:
  multilab-web:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: multilab-agroanalitica
    ports:
      - "5005:5005"
    environment:
      - PORT=5005
      - HOST=0.0.0.0
      - DEBUG=False
      - DB_PATH=/app/data/multilab.db
      - PDF_STORAGE_DIR=/app/static/pdfs
    env_file:
      - .env
    volumes:
      # Montar base de datos como volumen para persistencia
      - ./multilab.db:/app/multilab.db:ro
      # Montar directorio de PDFs para acceso desde host
      - ./static/pdfs:/app/static/pdfs
      # Montar .env si existe (opcional)
      # - ./.env:/app/.env:ro
    restart: unless-stopped
    # Límites de recursos (opcional)
    deploy:
      resources:
        limits:
          memory: 2G
        reservations:
          memory: 512M
    # Health check
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:5005/health", "||", "exit", "1"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 40s

